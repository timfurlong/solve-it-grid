[project]
name = "solve-it-grid"
version = "0.1.0"
description = "A Things 3 reward system based on the ADHD Solve It Grid"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "things.py>=1.0.1",
    "holidays>=0.50",
]

[project.scripts]
solve-it-grid = "solve_it_grid.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/solve_it_grid"]

[tool.pytest.ini_options]
addopts = "-m 'not live'"
markers = ["live: reads the real Things database"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# Explicit set: ruff's defaults change between releases. Local naive datetimes are
# deliberate (things.py returns local time), so the DTZ rules are not enabled.
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
